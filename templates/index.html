<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Recommender System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#ef4444', 600: '#dc2626' }
          }
        }
      }
    }
  </script>
  <style>
    .card { transition: transform .25s ease, box-shadow .25s ease; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -10px rgba(239,68,68,.35); }
    .fade-in { animation: fadeIn .4s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
    .spinner { border: 3px solid rgba(255,255,255,.15); border-top-color:#ef4444; border-radius:50%; width:36px; height:36px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg);} }
    /* dropdown */
    #movieDropdown { max-height: 260px; overflow-y: auto; }
    #movieDropdown::-webkit-scrollbar { width: 8px; }
    #movieDropdown::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-100 antialiased">
  <div class="max-w-6xl mx-auto px-4 py-10">
    <header class="text-center mb-10">
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-pink-500">Movie Recommender</span> System
      </h1>
      <p class="mt-3 text-gray-400">Pick a movie you love and discover 5 similar titles.</p>
    </header>

    <section class="bg-gray-900/70 backdrop-blur border border-gray-800 rounded-2xl p-6 shadow-xl mb-10">
      <div class="flex flex-col md:flex-row gap-4 items-stretch">
        <div class="relative flex-1">
          <input id="movieSearch" type="text" placeholder="Search or select a movie..."
                 class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500 placeholder-gray-500"
                 autocomplete="off" />
          <div id="movieDropdown" class="absolute z-20 mt-2 w-full bg-gray-800 border border-gray-700 rounded-xl hidden shadow-2xl"></div>
        </div>
        <button id="recommendBtn"
                class="px-6 py-3 rounded-xl bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 font-semibold shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
          Show Recommendations
        </button>
      </div>
      <p id="selectedLabel" class="mt-3 text-sm text-gray-400">No movie selected.</p>
    </section>

    <div id="loading" class="hidden flex flex-col items-center justify-center py-16">
      <div class="spinner"></div>
      <p class="mt-4 text-gray-400">Finding similar movies...</p>
    </div>

    <div id="results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-5"></div>

    <p id="empty" class="text-center text-gray-500 py-10">Your recommendations will appear here.</p>
  </div>

  <script>
    const movies = {{ movies | tojson }};
    let selectedMovie = null;

    const searchInput = document.getElementById('movieSearch');
    const dropdown = document.getElementById('movieDropdown');
    const selectedLabel = document.getElementById('selectedLabel');
    const btn = document.getElementById('recommendBtn');
    const results = document.getElementById('results');
    const loading = document.getElementById('loading');
    const empty = document.getElementById('empty');

    function renderDropdown(filter) {
      const q = filter.trim().toLowerCase();
      const list = q ? movies.filter(m => m.toLowerCase().includes(q)).slice(0, 60) : movies.slice(0, 60);
      if (!list.length) { dropdown.classList.add('hidden'); return; }
      dropdown.innerHTML = list.map(m =>
        `<div class="px-4 py-2 cursor-pointer hover:bg-red-600/40 text-sm" data-movie="${encodeURIComponent(m)}">${m}</div>`
      ).join('');
      dropdown.classList.remove('hidden');
    }

    searchInput.addEventListener('focus', () => renderDropdown(searchInput.value));
    searchInput.addEventListener('input', (e) => renderDropdown(e.target.value));

    dropdown.addEventListener('click', (e) => {
      const el = e.target.closest('[data-movie]');
      if (!el) return;
      selectedMovie = decodeURIComponent(el.getAttribute('data-movie'));
      searchInput.value = selectedMovie;
      selectedLabel.textContent = 'Selected: ' + selectedMovie;
      dropdown.classList.add('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target) && e.target !== searchInput) dropdown.classList.add('hidden');
    });

    async function getRecommendations() {
      if (!selectedMovie) {
        selectedLabel.textContent = 'Please select a movie first.';
        selectedLabel.classList.add('text-red-400');
        return;
      }
      selectedLabel.classList.remove('text-red-400');
      loading.classList.remove('hidden');
      empty.classList.add('hidden');
      results.innerHTML = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/recommend?movie=' + encodeURIComponent(selectedMovie));
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        loading.classList.add('hidden');
        results.innerHTML = data.names.map((name, idx) => `
          <div class="card fade-in bg-gray-900/80 border border-gray-800 rounded-2xl overflow-hidden">
            <img src="${data.posters[idx]}" alt="${name}" class="w-full aspect-[2/3] object-cover" loading="lazy" />
            <div class="p-3">
              <h3 class="text-sm font-semibold leading-tight">${name}</h3>
            </div>
          </div>
        `).join('');
        if (!data.names.length) empty.classList.remove('hidden');
      } catch (err) {
        loading.classList.add('hidden');
        empty.textContent = 'Something went wrong. Please try again.';
        empty.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', getRecommendations);
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') getRecommendations(); });
  </script>
</body>
</html>
